<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Ethiopian Time Converter | Standard Time</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="no-print" style="background:#fff; border-bottom:1px solid #e2e8f0; padding:15px 0; margin-bottom: 20px;">
  <div class="container" style="display:flex; justify-content:space-between; padding:0 20px;">
    <a href="/" style="font-weight:800; color:#3182ce; text-decoration:none;">Ethio Calendar</a>
    <nav style="display:flex; gap:15px; font-weight:600;"><a href="/">Converter</a><a href="/today.html">Today</a><a href="/printable-calendar.html">Printable</a></nav>
  </div>
</header>
<div class="container">
  <div class="card">
    <h1>Ethiopian ↔ Standard Time</h1>
    <div class="toggle-group" id="direction-toggle">
      <button class="active" data-dir="to-standard">Ethiopian → Standard</button>
      <button data-dir="to-ethiopian">Standard → Ethiopian</button>
    </div>
    <div class="row">
      <div class="field-group"><label>Hour (1–12)</label><input type="number" id="hour-input" min="1" max="12" value="6"></div>
      <div class="field-group"><label>Minute</label><input type="number" id="minute-input" min="0" max="59" value="30"></div>
    </div>
    <div class="field-group">
      <label for="period-input" id="period-label">Period (Ethiopian)</label>
      <select id="period-input">
        <option value="day">Day (ከሰዓት)</option>
        <option value="night">Night (ከምሽት)</option>
      </select>
    </div>
    <div class="result-box">
      <div class="label">Converted Time</div>
      <div class="value" id="converted-time">—</div>
    </div>
  </div>
</div>
<footer><p>© <span id="year"></span> Ethio Calendar</p></footer>
<script src="/app.js"></script>
</body>
</html>
